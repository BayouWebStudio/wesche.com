<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raul Wesche | Geometric Tattoo Artist</title>
  <meta name="description" content="Geometric and sacred geometry tattoo artist based in Houston, TX. Book your session today.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --black: #0a0a0a; --charcoal: #141414; --gold: #C9A84C; --white: #f5f5f0; --dim: #888; --border: rgba(255,255,255,0.07); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }
    .hero { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 48px 24px; }
    .hero-sub { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px; }
    .hero h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 300; line-height: 1; margin-bottom: 16px; }
    .hero-tagline { color: var(--dim); font-size: 1rem; margin-bottom: 48px; max-width: 480px; line-height: 1.7; }
    .cta-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-primary { background: var(--gold); color: #000; text-decoration: none; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 28px; border-radius: 2px; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-outline { border: 1px solid var(--border); color: var(--white); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 28px; transition: border-color 0.2s; }
    .btn-outline:hover { border-color: var(--gold); }
    .social { margin-top: 64px; display: flex; gap: 24px; justify-content: center; }
    .social a { color: var(--dim); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
    .social a:hover { color: var(--gold); }
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); color: var(--dim); font-size: 0.72rem; }
  </style>
</head>
<body>
  <section class="hero">
    <p class="hero-sub">Tattoo Temple Houston</p>
    <h1>Raul Wesche</h1>
    <p class="hero-tagline">Geometric and sacred geometry tattoo artist. Large-scale work, black and grey, dot-work. 12 years of craft. Based in Houston, TX.</p>
    <div class="cta-group">
      <a href="https://weschetattoo.com" class="btn-primary">Book a Session</a>
      <a href="https://weschetattoo.com/#gallery" class="btn-outline">View Portfolio</a>
    </div>
    <div class="social">
      <a href="https://instagram.com/weschetattoo" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/@weschetattoo" target="_blank" rel="noopener">TikTok</a>
      <a href="https://weschetattoo.com">weschetattoo.com</a>
    </div>
  </section>
  <footer>
    &#xa9; 2026 Raul Wesche &#x2014; Houston, TX
  </footer>
</body>
</html>
